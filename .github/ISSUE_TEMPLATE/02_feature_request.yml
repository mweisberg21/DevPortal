name: Feature Request
description: Suggest an improvement to DevPortal.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or pain should DevPortal improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional, but useful for larger UX or architecture changes.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I am willing to discuss the approach before implementation.
          required: true
